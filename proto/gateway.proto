syntax = "proto3";
package realtime;

enum MessageType {
    MESSAGE_TYPE_UNSPECIFIED = 0;
    TELEMETRY = 1;
    // 心跳沿用 Request/ACK；payload 必须为空，仍消耗限流和资源额度。
    HEARTBEAT = 2;
}
message Request {
    uint64 request_id = 1;
    string device_id = 2;
    MessageType message_type = 3;
    bytes payload = 4;
}
enum Result {
    OK = 0;
    INVALID_REQUEST = 1;
    UNKNOWN_MESSAGE_TYPE = 2;
    // 业务处理器异常；原有结果编号不变，ACK 仍携带请求的 request_id。
    INTERNAL_ERROR = 3;
}
message Ack {
    uint64 request_id = 1;
    Result result = 2;
    string error = 3;
}
